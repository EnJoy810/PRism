[project]
name = "prism-backend"
version = "0.1.0"
description = "PRism AI PR Review Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.50.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.0",
    "arq[redis]>=0.26.0",
    "json_repair>=0.8.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "semgrep>=1.90.0",
    "stamina>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "langsmith>=0.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/services/llm.py" = ["E501"]
"app/agents/judge.py" = ["E501"]
"app/routers/review.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
