review:
  budget:
    max_per_review_usd: 0.50
    max_tokens_per_call: 16384
  agents:
    expert_model: deepseek-v4-flash
    judge_model: deepseek-v4-pro
  filters:
    min_confidence: 0.7
    severity_threshold: WARNING
  skip:
    - "*.lock"
    - "*.snap"
    - "*.min.js"

github:
  # Secrets go in .env: GITHUB_WEBHOOK_SECRET, GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY
  webhook_secret: ""
  app_id:
  app_private_key:
