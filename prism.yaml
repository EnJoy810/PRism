llm:
  # API 密钥优先级：LLM_API_KEY 环境变量 > llm.api_key > DEEPSEEK_API_KEY > sk-placeholder
  api_key: ""
  # API 端点（兼容 OpenAI 协议）
  base_url: https://api.deepseek.com
  # 模型名
  model: deepseek-v4-flash

review:
  budget:
    max_per_review_usd: 0.50
    max_tokens_per_call: 16384
  agents:
    expert_model: deepseek-v4-flash
    judge_model: deepseek-v4-pro
  filters:
    min_confidence: 0.7
    severity_threshold: WARNING
  skip:
    - "*.lock"
    - "*.snap"
    - "*.min.js"
  # callgraph backend: "builtin" (tree-sitter SQLite BFS) or "codegraph" (npm @colbymchenry/codegraph)
  callgraph_backend: builtin
  # set to false to run in diff-only mode (no blast_radius, no impact_verification)
  callgraph_enabled: true

github:
  # Secrets go in .env: GITHUB_WEBHOOK_SECRET, GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY
  webhook_secret: ""
  app_id:
  app_private_key:
