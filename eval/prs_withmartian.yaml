- id: withmartian_grafana_8
  url: https://github.com/grafana/grafana/pull/90939
  kind: withmartian
  repo_group: grafana
  is_mirror: false
  pr_title: Frontend Asset Optimization
  expected_findings:
  - id: withmartian_grafana_8-g1
    description: The GetWebAssets function implements an incomplete double-checked locking pattern for caching web assets.
      The function first checks if the cache is populated using a read lock (RLock), and if the cache is empty, it acquires
      a write lock to populate it. However, it fails to re-check whether the cache was populated by another goroutine while
      waiting to acquire the write lock.
    severity: WARNING
    severity_original: Medium
  - id: withmartian_grafana_8-g2
    description: 'In addition to the missing double-check, the function has a critical flaw in its error handling: it unconditionally
      assigns the fetch result to the cache (line 69: entryPointAssetsCache = result) regardless of whether the fetch succeeded
      or failed. When an error occurs during asset fetching, result is nil, and this nil value overwrites any previously valid
      cache entry.'
    severity: ERROR
    severity_original: High
