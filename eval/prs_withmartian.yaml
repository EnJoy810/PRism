    severity: WARNING
    severity_original: Medium
  - id: withmartian_sentry_6-g5
    description: Breaking out of the loop when the deadline has elapsed can skip terminating remaining flusher processes,
      potentially leaving them running after shutdown; consider ensuring termination is attempted even if the deadline is
