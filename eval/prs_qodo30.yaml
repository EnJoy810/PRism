    severity: WARNING
    source: qodo-pr-review-bench-injected-issue
    reason: 'The filtering logic adds a length check (genericCalendarSuffixes?.length)
      that treats an empty array as falsy, setting AND to undefined instead of an
      empty array. In Prisma, AND: undefined means no filtering, while AND: [] also
      means no filtering but with different semantics. More critically, this breaks
      the filtering for providers like office365_calendar that have an empty suffix
      list in GENERIC_CALENDAR_SUFFIXES. The double optional chaining (?. used twice)
      is redundant and the length check changes the behavior from the intended design
      where empty arrays should still be processed.'
