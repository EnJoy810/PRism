# Signal / precision eval set — real-world merged PRs with human review comments.
#
# Selection criteria:
#   - merged PR from active open-source projects in Python / TypeScript
#   - diff 50-300 lines (not trivial, not overwhelming)
#   - >= 2 inline review_comments (evidence of serious human review)
#
# How to use:
#   cd backend && .venv/bin/python ../eval/run_eval.py \
#       --samples ../eval/prs_signal_smoke.yaml --out ../eval/runs
#
# Scoring: no golden expected_findings here.
# After running, open each .md output and manually label each finding:
#   👍 = actionable, correct, worth a developer's attention
#   👎 = noise, wrong, or trivially obvious
# Precision = 👍 / (👍 + 👎)

