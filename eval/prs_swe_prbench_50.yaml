      : Column(T.StringType(), nullable=False),\n            \"source_embedding\"\
      : Column(T.ArrayType(T.FloatType()), nullable=False),\n            \"target_embedding\"\
      : Column(T.ArrayType(T.FloatType()), nullable=False),\n        },\n        unique=[\"\
      source\", \"target\"],\n    )\n)\ndef attach_embeddings(\n    pairs_df: ps.DataFrame,\n\
