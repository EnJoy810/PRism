  - id: boto3__4629-c1
    file: boto3/s3/transfer.py
    line_range:
    - 210
    - 210
    title_keywords:
    - Sorry
    - just
    - getting
    - transfer
    evidence_keywords:
    - create_transfer_manager
    - client
    - config
    - transfer
    severity: WARNING
    source: swe-prbench-human-review
    reason: "Sorry I'm just getting back to this work. It's the same behavior as using\
      \ the `auto` value on an optimized instance:\r\n- `Filename`, `Bucket`, `Key`,\
      \ `ExtraArgs`, and `Callback` work as expected (same as core/native transfer\
      \ manager).\r\n- Values in `Config` (ie `boto3.s3.transfer.TransferConfig`)\
      \ are ignored.\r\n\r\nIdeally this would be rolled out with support for transfer\
      \ manager config parameters. But this at least gets us \"feature parity\" in\
      \ environments that aren't optimized instances. ie It's additive without being\
      \ a regression (in itself).\r\n\r\nI think whether this could expose us to potential\
      \ future regressions depends on what we envision transfer manager config parameter\
      \ support looks like:\r\n1. Same interface/usage as the native transfer manager.\
      \ It uses the values in the `boto3.s3.transfer.TransferConfig` object passed\
      \ to the `Config` arg.\r\n2. Some other interface, eg a new field in `boto3.s3.transfer.TransferConfig`.\
      \ Something like `crt_config`. It doesn't really matter exactly what it would\
      \ look like, just that it would be a different interface.\r\n\r\nThe way I'm\
      \ thinking about this is that we wouldn't want to pursue to 1st option because\
      \ that could break users:\r\n- I'm on an optimized instance with the `auto`\
      \ preferred client configured\r\n- I pass a transfer config that's currently\
      \ doing nothing\r\n- I upgrade and all of a sudden my transfer config starts\
      \ doing something\r\n\r\nSo while not exposing configs along with this update\
      \ isn't ideal, it at least gives users an option to use CRT transfer manager\
      \ with CRT-determined default values. I'm also open to rolling out the 2 together\
      \ instead of in separate releases. I just figured it would be faster to let\
      \ users enable CRT everywhere if we roll out incrementally."
