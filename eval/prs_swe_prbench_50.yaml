    reason: "I agree, we've struggled quite a bit with the validation logic. Either\
      \ keep the validation logic close to the dataset, or keep it close to the node\
      \ logic I'd say.\n\nAs part of our project, we went for the latter:\n\n1. A\
      \ small wrapper on top of Pandera to work both with Pandas and Spark\n2. Decorators\
      \ to validate input/output of functions\n\nSome code:\n\nWrapper:\n\n```python\n\
      \"\"\"\nTemp. wrapper module to enable data quality checks defined independently\
      \ of the underlying\nlibrary used to represent the data. Currently supports\
      \ Spark and Pandas dataframes.\n\nNOTE: Should be removed as soon as Pandera\
      \ supports this.\n\"\"\"\n\nimport inspect\nimport typing\nfrom dataclasses\
      \ import dataclass\nfrom functools import wraps\nfrom typing import Dict, List,\
      \ Optional\n\nimport pandas as pd\nimport pandera.pandas as pa\nimport pandera.pyspark\
      \ as pas\nimport pyspark.sql as ps\nfrom pandera.decorators import _handle_schema_error\n\
      \n\n@dataclass\nclass Column:\n    \"\"\"Data class to represent a class agnostic\
      \ Pandera Column.\"\"\"\n\n    type_: type\n    checks: Optional[List] = None\n\
      \    nullable: bool = True\n\n\n@dataclass\nclass DataFrameSchema:\n    \"\"\
      \"Data class to represent a class agnostic Pandera DataFrameSchema.\"\"\"\n\n\
      \    columns: Dict[str, Column]\n    unique: Optional[List] = None\n    strict:\
      \ bool = False\n\n    def build_for_type(self, type_) -> typing.Union[pas.DataFrameSchema,\
      \ pa.DataFrameSchema]:\n        # Build pandas version\n        if type_ is\
      \ pd.DataFrame:\n            return pa.DataFrameSchema(\n                columns={\n\
      \                    name: pa.Column(col.type_, checks=col.checks, nullable=col.nullable)\n\
      \                    for name, col in self.columns.items()\n               \
      \ },\n                unique=self.unique,\n                strict=self.strict,\n\
      \            )\n\n        # Build pyspark version\n        if type_ is ps.DataFrame:\n\
      \            return pas.DataFrameSchema(\n                columns={\n      \
      \              name: pas.Column(col.type_, checks=col.checks, nullable=col.nullable)\n\
      \                    for name, col in self.columns.items()\n               \
      \ },\n                unique=self.unique,\n                strict=self.strict,\n\
      \            )\n\n        raise TypeError()\n\n\ndef check_input(schema: DataFrameSchema,\
      \ df_name: str):\n    \"\"\"Decorator to validate output schema of decorated\
      \ function.\n\n    Args:\n        schema: Schema to validate\n        df_name\
      \ (optional): name of output arg to validate\n    \"\"\"\n\n    def decorator(func):\n\
      \        @wraps(func)\n        def wrapper(*args, **kwargs):\n            #\
      \ Get type hints for the function\n            type_hints = typing.get_type_hints(func)\n\
      \n            # Bind args and kwargs to parameter names\n            sig = inspect.signature(func)\n\
      \            bound = sig.bind(*args, **kwargs)\n            bound.apply_defaults()\n\
      \n            value = bound.arguments.get(df_name)\n            arg_type = type_hints.get(df_name)\n\
      \n            df_schema = schema.build_for_type(arg_type)\n\n            if\
      \ value is not None:\n                try:\n                    # breakpoint()\n\
      \                    df_schema.validate(value, lazy=False)\n               \
      \ except pa.errors.SchemaError as e:\n                    _handle_schema_error(\"\
      check_input\", func, df_schema, value, e)\n\n            output = func(*args,\
      \ **kwargs)\n\n            return output\n\n        return wrapper\n\n    return\
      \ decorator\n\n\ndef check_output(\n    schema: DataFrameSchema, df_name: Optional[str]\
      \ = None, raise_df_undefined: bool = True, pass_columns: bool = False\n):\n\
      \    \"\"\"Decorator to validate output schema of decorated function.\n\n  \
      \  Args:\n        schema: Schema to validate\n        df_name (optional): name\
      \ of output arg to validate\n        raise_df_undefined: if set, ensures error\
      \ is thrown if `df_name` is not defined\n        pass_cols (optional): boolean\
      \ indicating whether cols should be passed into callable\n    \"\"\"\n\n   \
      \ def decorator(func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n\
      \            if not (type_ := typing.get_type_hints(func).get(\"return\")):\n\
      \                raise TypeError(\"No output typehint specified!\")\n\n    \
      \        if df_name:\n                if not typing.get_origin(typing.Dict)\
      \ == dict:\n                    raise TypeError(\"Specified df_name arg, but\
      \ function output typehint is not dict.\")\n\n                type_ = typing.get_args(type_)[1]\n\
      \n            df_schema = schema.build_for_type(type_)\n\n            if pass_columns:\n\
      \                output = func(*args, **kwargs, cols=list(schema.columns.keys()))\n\
      \            else:\n                output = func(*args, **kwargs)\n\n     \
      \       if df_name is not None:\n                df = output.get(df_name)\n\n\
      \                if df is None and raise_df_undefined:\n                   \
      \ raise RuntimeError(f\"df {df_name} not found!\")\n            else:\n    \
      \            df = output\n\n            if df is not None:\n               \
      \ try:\n                    df_schema.validate(df, lazy=False)\n           \
      \     except pa.errors.SchemaError as e:\n                    _handle_schema_error(\"\
      check_output\", func, df_schema, df, e)\n\n            return output\n\n   \
      \     return wrapper\n\n    return decorator\n\n```\n\nA node file\n\n```python\n\
      @check_output(\n    schema=DataFrameSchema(\n        columns={\n           \
