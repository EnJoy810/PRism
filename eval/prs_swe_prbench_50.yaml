    reason: "1. No. Since `acks_late=False`, the message is acked instantly upon receipt.\
      \ The visibility timeout is effectively irrelevant for re-queuing because the\
      \ message is already acked before the scan runs. Increasing it wouldn't change\
      \ behavior. I would even say that we could reduce it.\r\n2. Under normal operation,\
      \ no. The immediate ack removes the message from the unacked queue right away.\
      \ The only scenario where re-queuing could happen is if the worker crashes or\
      \ dies between receiving the message and sending the ack). The duplicate detection\
      \ code is a defensive safety net, not a routine path."
