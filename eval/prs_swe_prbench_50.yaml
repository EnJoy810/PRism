- id: kedro__5273
  repo: kedro-org/kedro
  url: https://github.com/kedro-org/kedro/pull/5273
  kind: swe-prbench-Type2_Contextual
  expected_findings:
  - id: kedro__5273-c1
    file: kedro/pipeline/llm_context.py
    line_range:
    - 245
    - 245
    title_keywords:
    - Tools
    - instantiated
    - inside
    - llm_context
    evidence_keywords:
    - Experimental
    - utilities
    - constructing
    - llm_context
    severity: WARNING
    source: swe-prbench-human-review
    reason: "Tools should be instantiated inside each `llm_context_node` execution.\
      \ Even if a tool has no varying inputs, caching tool instances across nodes\
      \ or across a pipeline run should not be done at this level. Doing so would\
      \ introduce hidden shared state and break Kedro’s guarantees around node purity,\
      \ reproducibility, and safe parallel execution.\r\n\r\nReuse in Kedro is achieved\
      \ by reusing datasets and parameters, not runtime objects. In this design, the\
      \ expensive or shared parts (e.g. data, configs, credentials) are already loaded\
      \ and managed by Kedro, while tool instantiation itself is intentionally lightweight\
      \ and deterministic. Tool instantiation itself is intentionally lightweight.\
      \ It is just the construction of a callable or wrapper and is not a computationally\
      \ heavy operation.\r\n\r\nIf a tool truly requires caching or shared state,\
