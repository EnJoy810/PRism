- id: chia-blockchain__20458
  repo: Chia-Network/chia-blockchain
  url: https://github.com/Chia-Network/chia-blockchain/pull/20458
  kind: swe-prbench-Type2_Contextual
  expected_findings:
  - id: chia-blockchain__20458-c1
    file: chia/full_node/full_block_utils.py
    line_range:
    - 304
    - 304
    title_keywords:
    - Stale
    - comment
    - misrepresents
    - full_block_utils
    evidence_keywords:
    - header_block_from_block
    - transactions_info_optional
    - bytes
    - full_block_utils
    severity: WARNING
    source: swe-prbench-human-review
    reason: '### Stale comment misrepresents when transactions_info is parsed


      **Medium Severity**


      <!-- DESCRIPTION START -->

      The comment at lines 292-293 states "if request_filter is True it will read
      extra bytes and populate it properly", but the code now parses `transactions_info`
      unconditionally, regardless of `request_filter`. This changes the output format
      when `request_filter=False`: previously the header block would always indicate
      no `transactions_info`, but now it includes the actual `transactions_info` bytes
      when present. This behavioral change affects callers expecting the old output
      format, and the stale comment makes the intent unclear.

      <!-- DESCRIPTION END -->


      <!-- BUGBOT_BUG_ID: ref1_8e33ae95-61d8-4196-8678-cbbcd1bd54e2 -->


      <!-- LOCATIONS START

