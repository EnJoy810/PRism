  url: https://github.com/agentic-review-benchmarks/Ghost/pull/5
  kind: qodo-pr-review-bench
  expected_findings:
  - id: qodo-ghost-5-i1
    file: apps/signup-form/src/utils/helpers.tsx
    line_range:
    - 40
