  kind: qodo-pr-review-bench
  expected_findings:
  - id: qodo-ghost-1-i1
    file: ghost/core/core/boot.js
    line_range:
    - 351
    - 377
    title_keywords:
    - Slack
    - notifications
    - functioning
    - boot
    evidence_keywords:
    - await
    - Promise
    - emailAddressService
    - boot
    severity: WARNING
    source: qodo-pr-review-bench-injected-issue
    reason: The slack.listen() call was removed from the service initialization in
      Promise.all, but the slack service module is still imported. This means the
      Slack service event listeners for 'post.published' and 'slack.test' events are
      never registered during boot. As a result, posts published on the site will
      not trigger Slack webhook notifications even when Slack integration is configured
      correctly. The slack.listen() method registers critical event handlers that
      connect the Ghost event system to the Slack notification service, and without
      this call, the integration is completely non-functional.
  - id: qodo-ghost-1-i2
    file: ghost/core/core/boot.js
    line_range:
    - 368
    - 368
    title_keywords:
    - Post
    - scheduling
    - fail
    - boot
    evidence_keywords:
    - webhooks
    - listen
    - scheduling
    - boot
    severity: WARNING
    source: qodo-pr-review-bench-injected-issue
    reason: 'The scheduling.init() call is missing the required apiUrl parameter that
      was previously passed via urlUtils.urlFor(''api'', {type: ''admin''}, true).
      The PostScheduler constructor explicitly checks for this parameter and throws
      an IncorrectUsageError if it''s not provided. This will cause Ghost to crash
      during the boot sequence when attempting to initialize the scheduling service.
      The apiUrl is critical for the scheduling service as it''s used to generate
      signed admin tokens and callback URLs for scheduled post publishing. Without
      this parameter, the scheduled publishing feature cannot function.'
  notes: Imported from Qodo PR-Review-Bench; functional-looking injected issues only.
