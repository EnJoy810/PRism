- id: qodo-ghost-6
  repo: agentic-review-benchmarks/Ghost
  url: https://github.com/agentic-review-benchmarks/Ghost/pull/6
  kind: qodo-pr-review-bench
  expected_findings:
  - id: qodo-ghost-6-i1
    file: ghost/core/core/server/services/member-welcome-emails/jobs/index.js
    line_range:
    - 15
    - 15
    title_keywords:
    - scheduler
    - never
    - schedule
    - index
    evidence_keywords:
    - async
    - scheduleMemberWelcomeEmailJob
    - config
    - index
    severity: WARNING
    source: qodo-pr-review-bench-injected-issue
    reason: The condition `hasScheduled.processOutbox && !process.env.NODE_ENV.startsWith('test')`
      is incorrect - it checks if the job is already scheduled before scheduling it,
      creating a logical impossibility. The job will never be scheduled on the first
      call since `hasScheduled.processOutbox` starts as `false`. This should be `!hasScheduled.processOutbox`
      to schedule the job when it hasn't been scheduled yet. This breaks the welcome
      email processing functionality entirely, as the background job that processes
      the outbox entries will never be registered.
  - id: qodo-ghost-6-i2
    file: ghost/core/core/server/services/members/members-api/repositories/MemberRepository.js
    line_range:
    - 342
    - 342
    title_keywords:
    - Incorrect
    - logical
    - operator
    - MemberRepository
    evidence_keywords:
    - const
    - memberAddOptions
    - options
    - MemberRepository
    severity: WARNING
    source: qodo-pr-review-bench-injected-issue
    reason: 'The condition uses OR (`||`) instead of AND (`&&`) when checking whether
      to create welcome email outbox entries. This means welcome emails will be triggered
      if EITHER the config is set OR the source is ''member'', instead of requiring
      BOTH conditions. This causes two problems: (1) welcome emails are sent even
      when the feature is disabled (config not set) as long as source is ''member'',
      and (2) welcome emails are sent for disallowed sources (like ''import'' or ''admin'')
      when the config is set. The correct logic should require both the feature to
      be enabled AND the source to be in the allowed list.'
  notes: Imported from Qodo PR-Review-Bench; functional-looking injected issues only.
