    evidence_keywords:
    - export
    - function
    - getUrlHistory
    - helpers
    severity: WARNING
    source: qodo-pr-review-bench-injected-issue
    reason: The getUrlHistory() function can now return undefined when the form is
      embedded on the same host and getDefaultUrlHistory() returns undefined (e.g.,
      when sessionStorage is empty or invalid). This violates the URLHistory return
      type contract and will cause a runtime error when the API tries to use the history
