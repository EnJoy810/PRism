- id: qodo-ghost-3
  repo: agentic-review-benchmarks/Ghost
  url: https://github.com/agentic-review-benchmarks/Ghost/pull/3
  kind: qodo-pr-review-bench
  expected_findings:
  - id: qodo-ghost-3-i1
    file: ghost/core/core/server/services/email-service/DomainWarmingService.ts
    line_range:
    - 124
    - 129
    title_keywords:
    - High
    - volume
    - threshold
    - DomainWarmingService
    evidence_keywords:
    - high
    - volume
    - senders
    - DomainWarmingService
    severity: WARNING
    source: qodo-pr-review-bench-injected-issue
    reason: The condition uses `>=` instead of `>` when checking if lastCount qualifies
      for high-volume capping at exactly 400,000 emails. According to the documented
      scaling table, 400k should use the 2× multiplier from the thresholds array,
      but with this bug it immediately applies the high-volume cap of 1.2× or +75k
      absolute increase. For a site hitting exactly 400k messages, this means getting
      a limit of 480k (1.2×) or 475k (+75k) instead of the expected 800k (2×). This
      creates a significant bottleneck at a critical growth milestone and breaks the
      documented warmup progression.
  - id: qodo-ghost-3-i2
    file: ghost/core/core/server/services/email-service/DomainWarmingService.ts
    line_range:
    - 131
    - 135
    title_keywords:
    - Threshold
    - boundary
    - values
    - DomainWarmingService
    evidence_keywords:
    - const
    - threshold
    - WARMUP_SCALING_TABLE
    - DomainWarmingService
    severity: WARNING
    source: qodo-pr-review-bench-injected-issue
    reason: The loop uses `<` instead of `<=` when comparing lastCount to threshold
      limits. This causes exact boundary values (1000, 5000, 100000, 400000) to incorrectly
      skip their tier and fall through to the next scaling factor or the fallback
      logic. For example, a site with exactly 1000 previous emails will bypass the
      1.25× tier and incorrectly use 1.5× scaling (getting 1500 instead of 1250).
      Similarly, 5000 will use 1.75× instead of 1.5×, and 100000 will use 2× instead
      of 1.75×. This creates unexpected jumps in scaling at precisely the documented
      threshold boundaries.
  notes: Imported from Qodo PR-Review-Bench; functional-looking injected issues only.
- id: qodo-ghost-4
  repo: agentic-review-benchmarks/Ghost
  url: https://github.com/agentic-review-benchmarks/Ghost/pull/4
  kind: qodo-pr-review-bench
  expected_findings:
  - id: qodo-ghost-4-i1
    file: apps/posts/src/views/comments/components/comments-list.tsx
    line_range:
    - 92
    - 104
    title_keywords:
    - Missing
    - dependency
    - useEffect
    - comments-list
    evidence_keywords:
    - useEffect
    - const
    - checkIfClamped
    - comments-list
    severity: WARNING
    source: qodo-pr-review-bench-injected-issue
    reason: The CommentContent component's useEffect hook has an empty dependency
      array, but it uses item.html to determine if content should be clamped. When
      a comment's HTML content changes (e.g., after an edit or when new data is loaded),
      the clamp detection won't re-run. This means the 'Show more' button may appear
      when it shouldn't or disappear when it should still be visible, creating a poor
      user experience. The dependency array should include item.html to ensure the
      clamp detection re-runs whenever the content changes.
  - id: qodo-ghost-4-i2
    file: apps/posts/src/views/comments/components/comments-list.tsx
    line_range:
    - 236
    - 248
    title_keywords:
    - Filter
    - button
    - becomes
    - comments-list
    evidence_keywords:
    - item
    - post
    - title
    - comments-list
    severity: WARNING
    source: qodo-pr-review-bench-injected-issue
    reason: The conditional check for rendering the post title button was changed
      from `item.post?.id && item.post?.title && onAddFilter` to `item.post?.id &&
      item.post?.title`, removing the onAddFilter null check. However, the button's
      onClick handler still calls onAddFilter('post', item.post!.id). Since onAddFilter
      is now a required prop in the TypeScript signature but the runtime check was
      removed, if onAddFilter is ever undefined or null at runtime, clicking the post
      title button will throw an error and crash the component. The original three-part
      condition was protecting against this scenario.
  notes: Imported from Qodo PR-Review-Bench; functional-looking injected issues only.
