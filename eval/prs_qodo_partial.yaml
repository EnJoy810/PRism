- id: qodo-ghost-9
  repo: agentic-review-benchmarks/Ghost
  url: https://github.com/agentic-review-benchmarks/Ghost/pull/9
  kind: qodo-pr-review-bench
  expected_findings:
  - id: qodo-ghost-9-i1
    file: ghost/core/core/server/services/email-service/DomainWarmingService.ts
    line_range:
    - 75
    - 75
    title_keywords:
    - Incorrect
    - rounding
    - calculation
    - DomainWarmingService
    evidence_keywords:
    - data
    - length
    - return
    - DomainWarmingService
    severity: WARNING
    source: qodo-pr-review-bench-injected-issue
    reason: The getDaysSinceFirstEmail method uses Math.ceil instead of Math.floor
      to calculate days since the first email. This causes the warmup to start one
      day ahead of schedule. For example, on the same day an email is sent (even minutes
      after), the partial day will round up to day 1 instead of day 0. This breaks
      the entire 42-day warmup progression as all subsequent calculations will be
      offset by one day, causing the service to use higher email limits than intended
      for each actual day, potentially harming domain reputation by warming up too
      aggressively.
  - id: qodo-ghost-9-i2
    file: ghost/core/core/server/services/email-service/DomainWarmingService.ts
    line_range:
    - 85
    - 86
    title_keywords:
    - error
    - warmup
    - completion
    - DomainWarmingService
    evidence_keywords:
    - const
    - await
    - getDaysSinceFirstEmail
    - DomainWarmingService
    severity: WARNING
    source: qodo-pr-review-bench-injected-issue
    reason: The condition checking if warmup is complete uses `day > this.#warmupConfig.totalDays`
      instead of `day >= this.#warmupConfig.totalDays`. With a 42-day warmup period
      (totalDays=42), this means the warmup won't complete until day 43 instead of
      day 42. On day 42, the system will still calculate and apply a limit instead
      of returning Infinity to indicate unlimited sending. This extends the warmup
      period by one full day, delaying when users can send emails at full volume and
      potentially causing confusion when the warmup doesn't complete as documented.
  notes: Imported from Qodo PR-Review-Bench; functional-looking injected issues only.
