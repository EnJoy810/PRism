  url: synthetic://codereviewbench/codereviewbench__example_49_app_jobs_background_job_processor_rb
  kind: codereviewbench-local
  lang: ruby
  synthetic_diff: "--- a/app/jobs/background_job_processor.rb\n+++ b/app/jobs/background_job_processor.rb\n\
    \n@@ -4,2 +4,90 @@\n \n+class BackgroundJobProcessor\n+  attr_reader :logger,\
    \ :concurrency\n+\n+  def initialize(concurrency: 5, logger: Rails.logger)\n+\
    \    @concurrency = concurrency\n+    @logger = logger\n+    @threads = []\n+\
    \    @running = false\n+  end\n+\n+  def start\n+    @running = true\n+    @logger.info(\"\
    Starting job processor with #{@concurrency} workers\")\n+\n+    @concurrency.times\
    \ do |i|\n+      @threads << Thread.new do\n+        worker_loop(i)\n+      end\n\
    +    end\n+  end\n+\n+  def worker_loop(worker_id)\n+    while @running\n+   \
    \   job = fetch_next_job\n+      if job\n+        process_job(job, worker_id)\n\
    +      else\n+        sleep(0.1)\n+      end\n+    end\n+  end\n+\n+  def fetch_next_job\n\
    +    job = Job.where(status: 'queued').order(:priority).first\n+    return nil\
    \ unless job\n+\n+    if job.status == 'queued'\n+      job.update!(status: 'running')\n\
    +      job\n+    end\n+  end\n+\n+  def process_job(job, worker_id)\n+    @logger.info(\"\
    Worker #{worker_id} processing job #{job.id}\")\n+    args = Marshal.load(job.serialized_args)\n\
    +    handler_class = job.handler_class.constantize\n+    handler = handler_class.new\n\
    +    result = handler.perform(args)\n+\n+    job.update!(status: 'completed',\
    \ result: result.to_json)\n+    @logger.info(\"Job #{job.id} completed by worker\
    \ #{worker_id}\")\n+  rescue StandardError => e\n+    @logger.error(\"Job #{job.id}\
    \ failed: #{e.message}\")\n+    handle_failure(job, e)\n+  end\n+\n+  def handle_failure(job,\
    \ error)\n+    if job.retry_count < job.max_retries\n+      job.update!(\n+  \
    \      status: 'queued',\n+        retry_count: job.retry_count + 1,\n+      \
    \  last_error: error.message\n+      )\n+    else\n+      job.update!(\n+    \
    \    status: 'dead',\n+        last_error: error.message,\n+        failed_at:\
    \ Time.current\n+      )\n+      @logger.error(\"Job #{job.id} moved to dead letter\
    \ queue\")\n+    end\n+  end\n+\n+  def stop\n+    @running = false\n+    @threads.each(&:join)\n\
    +    @logger.info('Job processor stopped')\n+  end\n+\n+  def stats\n+    {\n\
    +      queued: Job.where(status: 'queued').count,\n+      running: Job.where(status:\
    \ 'running').count,\n+      completed: Job.where(status: 'completed').count,\n\
    +      dead: Job.where(status: 'dead').count,\n+      workers: @threads.count(&:alive?)\n\
    +    }\n+  end\n+end\n__old hunk__\n \n"
