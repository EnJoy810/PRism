- id: dask__12103
  repo: dask/dask
  url: https://github.com/dask/dask/pull/12103
  kind: swe-prbench-manual-Type1_Direct
  expected_findings:
  - id: dask__12103-c1
    file: dask/utils.py
    line_range:
    - 2359
    - 2359
    title_keywords:
    - dislike
    - these
    - fail
    - exception
    evidence_keywords:
    - __exit__
    - self
    - exc_type
    - exc_value
    severity: WARNING
    source: swe-prbench-human-review-manual-pick
    reason: I dislike that these can fail with an exception. We don't know that just
      because an object has `.nnz` that it's comparable to an int, and we don't know
      that `obj.shape` is a sequence. I'd feel better if these also catch exceptions
      (probably broad ones) so that we get through to the fallback.
  notes: Manually selected from SWE-PRBench for clearer code-risk signal.
