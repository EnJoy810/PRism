# Langfuse standalone deployment — run alongside PRism bare process on the server.
# Usage: docker compose -f langfuse-compose.yml up -d
#
# After starting, Langfuse UI is at http://<server-ip>:3002
# Login: admin@prism.local / prism-admin-2026
# Add to PRism .env:
#   LANGFUSE_PUBLIC_KEY=pk-lf-077b4dbaf8b03438a0747d98d278b480
#   LANGFUSE_SECRET_KEY=sk-lf-6f28c9d16a557ca7b798e46b8ceb7a4a
#   LANGFUSE_HOST=http://localhost:3002

services:
  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    ports:
      - "3002:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_SECRET: bbd137e91533413235bffa74408a631052ebe39712fd777eef73ab78315c437d
      SALT: 0a6271f4185fbe800bd52b8db602e163
      LANGFUSE_INIT_ORG_ID: prism-org
      LANGFUSE_INIT_ORG_NAME: PRism
      LANGFUSE_INIT_PROJECT_ID: prism-project
      LANGFUSE_INIT_PROJECT_NAME: PRism
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-077b4dbaf8b03438a0747d98d278b480
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-6f28c9d16a557ca7b798e46b8ceb7a4a
      LANGFUSE_INIT_USER_EMAIL: admin@prism.dev
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: prism-admin-2026
      TELEMETRY_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  langfuse_pg_data:
